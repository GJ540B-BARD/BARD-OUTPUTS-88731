<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Particle Sphere</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    canvas { display: block; cursor: grab; }
    canvas:active { cursor: grabbing; }
  </style>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 0, 9);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const PR = renderer.getPixelRatio();
    const root = new THREE.Group();
    scene.add(root);

    const fragmentShader = `
      varying vec3 vColor;
      varying float vAlpha;
      void main() {
        float d = length(gl_PointCoord - vec2(0.5));
        if (d > 0.5) discard;
        float a = smoothstep(0.5, 0.0, d);
        gl_FragColor = vec4(vColor, a * vAlpha);
      }
    `;

    const SPHERE_RADIUS = 2.4;
    const SPHERE_POINTS = 14000;

    const spherePos = [];
    const sphereSize = [];
    const golden = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < SPHERE_POINTS; i++) {
      const y = 1 - (i / (SPHERE_POINTS - 1)) * 2;
      const r = Math.sqrt(1 - y * y);
      const theta = golden * i;
      spherePos.push(
        Math.cos(theta) * r * SPHERE_RADIUS,
        y * SPHERE_RADIUS,
        Math.sin(theta) * r * SPHERE_RADIUS
      );
      sphereSize.push(Math.random() * 0.05 + 0.07);
    }

    const sphereGeo = new THREE.BufferGeometry();
    sphereGeo.setAttribute('position', new THREE.Float32BufferAttribute(spherePos, 3));
    sphereGeo.setAttribute('size', new THREE.Float32BufferAttribute(sphereSize, 1));

    const sphereMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: { uTime: { value: 0 }, uPR: { value: PR } },
      vertexShader: `
        attribute float size;
        uniform float uTime;
        uniform float uPR;
        varying vec3 vColor;
        varying float vAlpha;
        void main() {
          vec4 world = modelMatrix * vec4(position, 1.0);
          vec3 n = normalize(world.xyz - (modelMatrix * vec4(0.0,0.0,0.0,1.0)).xyz);
          vec3 viewDir = normalize(cameraPosition - world.xyz);
          float facing = dot(n, viewDir);

          vec3 magenta = vec3(1.00, 0.20, 0.85);
          vec3 purple  = vec3(0.60, 0.25, 1.00);
          vec3 teal    = vec3(0.10, 0.85, 0.80);

          vec3 col = mix(magenta, purple, smoothstep(0.0, 0.35, facing));
          col = mix(col, teal, smoothstep(0.35, 0.95, facing));
          if (facing < 0.0) col = mix(purple, teal, 0.5);

          float rim = pow(1.0 - abs(facing), 3.0);
          vColor = col * (0.55 + rim * 1.2);
          vAlpha = facing > 0.0 ? 0.95 : 0.45;

          float pulse = 1.0 + 0.15 * sin(uTime * 2.0 + position.y * 2.0);
          vec4 mv = viewMatrix * world;
          gl_PointSize = size * pulse * uPR * (320.0 / -mv.z);
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader
    });
    const sphere = new THREE.Points(sphereGeo, sphereMat);
    root.add(sphere);

    const RING_COUNT = 6;
    const PARTICLES_PER_RING = 3500;
    const rings = [];

    const ringMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: { uPR: { value: PR } },
      vertexShader: `
        attribute float size;
        attribute vec3 color;
        uniform float uPR;
        varying vec3 vColor;
        varying float vAlpha;
        void main() {
          vColor = color;
          vAlpha = 0.9;
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = size * uPR * (320.0 / -mv.z);
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader
    });

    for (let i = 0; i < RING_COUNT; i++) {
      const particleCount = PARTICLES_PER_RING;
      const radius = 3.1 + Math.random() * 0.9;
      const thickness = 0.5 + Math.random() * 0.4;

      const positions = [];
      const colors = [];
      const sizes = [];

      for (let j = 0; j < particleCount; j++) {
        const angle = (j / particleCount) * Math.PI * 2;
        const radiusVariation = radius + (Math.random() - 0.5) * thickness;
        const x = Math.cos(angle) * radiusVariation;
        const y = (Math.random() - 0.5) * thickness;
        const z = Math.sin(angle) * radiusVariation;
        positions.push(x, y, z);

        const hue = (i / RING_COUNT) * 0.7 + (j / particleCount) * 0.3;
        const color = new THREE.Color().setHSL(hue % 1, 1, 0.6);
        color.multiplyScalar(1.2);
        colors.push(color.r, color.g, color.b);

        sizes.push(Math.random() * 0.12 + 0.06);
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geo.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

      const ring = new THREE.Points(geo, ringMat);
      ring.rotation.set(
        (Math.random() - 0.5) * Math.PI,
        Math.random() * Math.PI,
        (Math.random() - 0.5) * Math.PI
      );
      ring.userData.speed = (0.08 + Math.random() * 0.18) * (Math.random() < 0.5 ? -1 : 1);
      ring.userData.wobble = Math.random() * Math.PI * 2;
      rings.push(ring);
      root.add(ring);
    }

    let dragging = false, lastX = 0, lastY = 0;
    let targetRotX = 0.15, targetRotY = 0;
    const el = renderer.domElement;

    el.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
    addEventListener('pointerup', () => dragging = false);
    addEventListener('pointermove', e => {
      if (!dragging) return;
      targetRotY += (e.clientX - lastX) * 0.006;
      targetRotX += (e.clientY - lastY) * 0.006;
      lastX = e.clientX; lastY = e.clientY;
    });
    el.addEventListener('wheel', e => {
      camera.position.z = Math.min(16, Math.max(5, camera.position.z + e.deltaY * 0.005));
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      const dt = clock.getDelta();

      sphereMat.uniforms.uTime.value = t;

      if (!dragging) targetRotY += 0.0015;
      root.rotation.y += (targetRotY - root.rotation.y) * 0.08;
      root.rotation.x += (targetRotX - root.rotation.x) * 0.08;

      sphere.rotation.y = t * 0.15;

      rings.forEach((ring, i) => {
        ring.rotation.y += ring.userData.speed * 0.016;
        ring.rotation.x += Math.sin(t * 0.3 + ring.userData.wobble) * 0.0008;
      });

      renderer.render(scene, camera);
    }
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
